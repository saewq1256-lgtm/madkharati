name: Build Madkharati APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ZIP_FILE=""
          for f in madkharati-cloud-sync-project.zip madkharati-cloud-sync-project-repaired.zip madkharati-android-project-github.zip; do
            if [ -f "$f" ]; then
              ZIP_FILE="$f"
              break
            fi
          done
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP file not found in repository root"
            ls -la
            exit 1
          fi
          echo "Extracting $ZIP_FILE"
          unzip -o -q "$ZIP_FILE"
          test -d madkharati-android || { echo "ERROR: madkharati-android folder not found"; exit 1; }

      - name: Build APK
        run: |
          cd madkharati-android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: madkharati-apk
          path: madkharati-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
